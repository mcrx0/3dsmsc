name: Build

on:
  push:
    branches: [monitor]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install analysis tools
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy
      - name: Check formatting, static analysis, and tests
        run: bash scripts/check-quality.sh

  3ds:
    needs: host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install devkitPro
        uses: devkitpro/devkitpro@v1
        with:
          packages: 3ds-dev
      - name: Install icon renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-2 libcairo2
      - name: Configure
        run: |
          cmake -S . -B build/3ds -G Ninja \
            -DBUILD_3DS=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_TOOLCHAIN_FILE=cmake/3DS.cmake
      - name: Build
        run: cmake --build build/3ds
      - name: Check main-thread stack usage
        run: bash scripts/check-stack-usage.sh
      - name: Verify package
        run: |
          test "$(head -c 4 build/3ds/3dsmsc.3dsx)" = "3DSX"
          file build/3ds/3dsmsc.3dsx
      - uses: actions/upload-artifact@v4
        with:
          name: 3dsmsc-3dsx
          path: build/3ds/3dsmsc.3dsx
